<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Available Vehicles</h1>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <div class="flex gap-16">
      <!--search-->
      <div class="flex-1 min-w-64">
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Search </label>

        <input
          [value]="searchBy()"
          (input)="onSearchBy($any($event).target.value)"
          type="text"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Search ..."
        />
      </div>

      <!--  Filter -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Rental Company </label>

        <select
          [value]="RentalCompanyId()"
          (change)="onRentalCompanyId($any($event).target.value)"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">All</option>
          @for (company of RentalCompany(); track $index) {
            <option [value]="company.id">{{ company.companyName }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Vehicle Category </label>

        <select
          [value]="vehicleCategoryId()"
          (change)="onVehicleCategoryId($any($event).target.value)"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">All</option>
          @for (category of vehicleCategory(); track $index) {
            <option [value]="category.id">{{ category.categoryName }}</option>
          }
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Seating Capacity </label>

        <select
          [value]="SeatingCapacity()"
          (change)="onSeatingCapacityChange($any($event).target.value)"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">All</option>
          @for (seating of seatings(); track $index) {
            <option [value]="seating">{{ seating }}</option>
          }
        </select>
      </div>
      <div class="flex gap-5 items-center">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            From Daily Rental Rate
          </label>

          <input
            type="number"
            [min]="0"
            [value]="fromDailyRate()"
            (change)="onFromDailyRateChange($any($event.target).value)"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl"
          />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            To Daily Rental Rate
          </label>

          <input
            type="number"
            [min]="0"
            [value]="toDailyRate()"
            (change)="onToDailyRateChange($any($event.target).value)"
            class="w-full px-4 py-3 border border-gray-300 rounded-xl"
          />
        </div>
        <div class="mt-6">
          <button
            type="button"
            (click)="applyDailyRateFilter()"
            class="px-5 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700"
          >
            Apply
          </button>
        </div>
      </div>
    </div>
  </div>

  <app-generic-table
    [columns]="column"
    [actions]="action"
    [data]="vehicle()"
    [sortBy]="sortBy()"
    [sortDirection]="sortDirection()"
    (sort)="onSortBy($event)"
    (action)="onTableAction($event)"
  >
  </app-generic-table>

  @if (vehicle().length > 0) {
    <div class="px-6 py-4 border-t mt-4 border-gray-400 flex items-center justify-between">
      <div class="text-sm text-gray-600">
        page
        <span class="font-semibold">{{ pageNumber() }}</span>
        of
        <span class="font-semibold">{{ totalPages() }}</span>
      </div>

      <div class="flex items-center gap-3">
        <button
          (click)="previousPage()"
          [disabled]="!hasPrevious() "
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          previous
        </button>
        <button
          (click)="nextPage()"
          [disabled]="!hasNext() "
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          next
        </button>
      </div>
    </div>
  }
</div>

@if (showBookVehicle()) {
  <app-book-vehicle [vehicleInput]="currentAvailableVehicle()!" (closeModal)="closeBookVehicle()">
  </app-book-vehicle>
}

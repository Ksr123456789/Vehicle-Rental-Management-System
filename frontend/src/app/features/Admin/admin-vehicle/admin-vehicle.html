<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Vehicles</h1>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <div class="flex gap-16">
      <div class="flex-1 min-w-64">
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Search </label>

        <input
          [value]="searchBy()"
          (input)="onSearchBy($any($event).target.value)"
          type="text"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Search ..."
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Availablity </label>

        <select
          [value]="vehicleAvailabilityStatus()"
          (change)="onVehicleAvailabilityStatusChange($any($event).target.value)"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">All</option>
          <option value="0">Available</option>
          <option value="1">Un-Available</option>
          <option value="2">In-Maintenance </option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Vehicle Category </label>

        <select
          [value]="vehicleCategoryId()"
          (change)="onVehicleCategoryId($any($event).target.value)"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">All</option>
          @for (category of vehicleCategory(); track $index) {
            <option [value]="category.id">{{ category.categoryName }}</option>
          }
        </select>
      </div>
    </div>
  </div>

  <div class="flex justify-end">
    <button
      (click)="openAddVehicleModal()"
      class="bg-blue-500 text-white font-bold px-8 py-4 rounded-xl cursor-pointer hover: bg-blue-700 transition"
    >
      Add Vehicle
    </button>
  </div>

  <app-generic-table
    [columns]="column"
    [actions]="action"
    [data]="vehicle()"
    [sortBy]="sortBy()"
    [sortDirection]="sortDirection()"
    (sort)="onSortBy($event)"
    (action)="onTableAction($event)"
  >
  </app-generic-table>

  @if (vehicle().length > 0) {
    <div class="px-6 py-4 border-t mt-4 border-gray-400 flex items-center justify-between">
      <div class="text-sm text-gray-600">
        page
        <span class="font-semibold">{{ pageNumber() }}</span>
        of
        <span class="font-semibold">{{ totalPages() }}</span>
      </div>

      <div class="flex items-center gap-3">
        <button
          (click)="previousPage()"
          [disabled]="!hasPrevious() || loading()"
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          previous
        </button>
        <button
          (click)="nextPage()"
          [disabled]="!hasNext() || loading()"
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          next
        </button>
      </div>
    </div>
  }
</div>

@if (showAddVehicleModal()) {
  <app-admin-add-vehicle
    [rentalCompanyInput]="rentalCompany()"
    [vehicleCategoryInput]="vehicleCategory()"
    (closeModal)="closeAddVehicleModal()"
    (loadVehicleOutput)="loadVehicle()"
  >
  </app-admin-add-vehicle>
}

@if (showUpdateVehicleModal()) {
  <app-admin-update-vehicle
    [vehicleInput]="currentVehicle()!"
    [vehicleCategoryInput]="vehicleCategory()"
    [rentalCompanyInput]="rentalCompany()"
    (closeModal)="closeUpdateVehicleModal()"
    (loadVehicleOutput)="loadVehicle()"
  >
  </app-admin-update-vehicle>
}

@if (showDeleteVehicleModal()) {
  <app-delete-modal
    (closeModal)="closeDeleteVehicleModal()"
    (deleteData)="deleteVehicle()"
  ></app-delete-modal>
}

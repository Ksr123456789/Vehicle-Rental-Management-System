<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Rental Companies</h1>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
    <div class="flex gap-16">
      <!--search-->
      <div class="flex-1 min-w-64">
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Search </label>

        <input
          type="text"
          [value]="searchBy()"
          (input)="onSearchBy($any($event).target.value)"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Search ..."
        />
      </div>

      <!--  Filter -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> company Type </label>

        <select
          [value]="companyType()"
          (change)="onCompanyTypeChange($any($event).target.value)"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">All</option>
          <option value="0">Budget</option>
          <option value="1">Economy</option>
          <option value="2">Premium</option>
          <option value="3">Luxury</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2"> Company Status </label>

        <select
          [value]="companyStatus()"
          (change)="onCompanyStatusChange($any($event).target.value)"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
          <option value="">All</option>
          <option value="0">Active</option>
          <option value="1">InActive</option>
        </select>
      </div>
    </div>
  </div>

  <div class="flex justify-end">
    <button
      class="bg-blue-500 text-white font-bold px-6 py-4 rounded-xl cursor-pointer hover: bg-blue-700 transition"
      (click)="openAddCompanyModal()"
    >
      Add Company
    </button>
  </div>

  <app-generic-table
    [columns]="column"
    [actions]="action"
    [data]="rentalCompany()"
    [sortBy]="sortBy()"
    [sortDirection]="sortDirection()"
    (sort)="onSortBy($event)"
    (action)="onTableAction($event)"
  >
  </app-generic-table>

  @if (rentalCompany().length > 0) {
    <div class="px-6 py-4 border-t mt-4 border-gray-400 flex items-center justify-between">
      <div class="text-sm text-gray-600">
        page
        <span class="font-semibold">{{ pageNumber() }}</span>
        of
        <span class="font-semibold">{{ totalPages() }}</span>
      </div>

      <div class="flex items-center gap-3">
        <button
          (click)="previousPage()"
          [disabled]="!hasPrevious() || loading()"
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          previous
        </button>
        <button
          (click)="nextPage()"
          [disabled]="!hasNext() || loading()"
          class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          next
        </button>
      </div>
    </div>
  }
</div>

@if (showAddCompanyModal()) {
  <app-admin-add-company (closeModal)="closeAddCompanyModal()" (loadCompanyOutput)="loadRentalCompany()"> </app-admin-add-company>
}

@if (showUpdateCompanyModal()) {
  <app-admin-update-company
    (closeModal)="closeUpdateCompanyModal()"
    [rentalCompanyInput]="currentRentalCompany()!"
    (loadcompanyOutput)="loadRentalCompany()"
  >
  </app-admin-update-company>
}

@if (showDeleteCompanyModal()) {
  <app-delete-modal
    (closeModal)="closeDeleteCompanyModal()"
    (deleteData)="deleteRentalCompany()"
  ></app-delete-modal>
}
